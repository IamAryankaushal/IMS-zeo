name: IMS Continuous Delivery Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual trigger"
        required: false
        default: "Manual delivery run"

jobs:
  # ── Job 1: Unit Tests ──────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd backend
          python -m pytest tests/test_core.py -v --tb=short \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/test-results.xml

  # ── Job 2: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: |
          cd backend
          ruff check app/ tests/ --output-format=github

  # ── Job 3: Build & Package Artifact ───────────────────────────────────────
  # Core of Continuous Delivery:
  # Images are built, validated, saved as downloadable artifacts on GitHub.
  # Nothing is deployed automatically — human runs deploy_local.sh to deliver.
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [ test, lint ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose config
        run: docker compose config

      - name: Build backend image
        run: |
          docker compose build backend
          echo "Backend image built successfully"

      - name: Build frontend image
        run: |
          docker compose build frontend
          echo "Frontend image built successfully"

      - name: Save backend image as tarball
        run: |
          docker save ims-backend:latest | gzip > ims-backend.tar.gz

      - name: Save frontend image as tarball
        run: |
          docker save ims-frontend:latest | gzip > ims-frontend.tar.gz

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ims-backend-image
          path: ims-backend.tar.gz
          retention-days: 7

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ims-frontend-image
          path: ims-frontend.tar.gz
          retention-days: 7

      - name: Generate delivery summary
        run: |
          echo "## Delivery Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Image | Built and packaged |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Image | Built and packaged |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are ready. Run bash scripts/deploy_local.sh to deploy." >> $GITHUB_STEP_SUMMARY

  # ── Job 4: Notify Ready ────────────────────────────────────────────────────
  notify:
    name: Mark Delivery Ready
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Delivery ready notification
        run: |
          echo "============================================"
          echo "  DELIVERY PIPELINE COMPLETE"
          echo "  All checks passed. Artifacts are ready."
          echo ""
          echo "  To deploy locally:"
          echo "  bash scripts/deploy_local.sh"
          echo "============================================"
